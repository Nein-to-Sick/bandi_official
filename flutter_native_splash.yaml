flutter_native_splash:
  # Common background color
  color: "#000000"

  # Default image for Android 13 and below
  image_android: assets/images/splash/splash_onki.png

  # iOS-specific splash image
  image_ios: assets/images/splash/splash_onki.png

  android_12:
    # Splash image for Android 12 only
    image: assets/images/splash/splash_onki.png
    icon_background_color: "#000000"
    background_image: assets/images/splash/splash_background.png

  web: false